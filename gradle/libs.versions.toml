[versions]
agp = "9.4.1"
kotlin = "2.4.21"
compose = "2026.09.00"
lifecycle = "2.11.0"
media = "1.11.1"
work = "2.11.1"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.13.0" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
media-player = { module = "androidx.media3:media3-exoplayer", version.ref = "media" }
media-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media" }
media-ui = { module = "androidx.media3:media3-ui", version.ref = "media" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
junit = { module = "org.junit.jupiter:junit-jupiter", version = "5.11.4" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.11.4" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
